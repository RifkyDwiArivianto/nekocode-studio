</head>
<body data-tab="code">
<div id="app">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></symbol><symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol><symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></symbol><symbol id="i-vol" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></symbol><symbol id="i-mute" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol><symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7L19 15z"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol><symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol><symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></symbol><symbol id="i-down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol><symbol id="i-code" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></symbol><symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol><symbol id="i-term" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></symbol><symbol id="i-cat" viewBox="0 0 24 24"><path d="M4 4l4 3a9 9 0 0 1 8 0l4-3v9a8 8 0 0 1-16 0V4z"/><path d="M9 14v.01M15 14v.01"/><path d="M10.5 17.5c.9.6 2.1.6 3 0"/></symbol><symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol><symbol id="i-archive" viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></symbol><symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></symbol><symbol id="i-palette" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.83-.44-1.12-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.55-2.5 5.55-5.55C21.97 6.01 17.46 2 12 2z"/></symbol><symbol id="i-undo" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol><symbol id="i-redo" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></symbol><symbol id="i-left" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol><symbol id="i-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol><symbol id="i-arr-up" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></symbol><symbol id="i-arr-down" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol><symbol id="i-indent" viewBox="0 0 24 24"><polyline points="3 8 7 12 3 16"/><line x1="21" y1="12" x2="11" y2="12"/><line x1="21" y1="6" x2="11" y2="6"/><line x1="21" y1="18" x2="11" y2="18"/></symbol><symbol id="i-outdent" viewBox="0 0 24 24"><polyline points="7 8 3 12 7 16"/><line x1="21" y1="12" x2="11" y2="12"/><line x1="21" y1="6" x2="11" y2="6"/><line x1="21" y1="18" x2="11" y2="18"/></symbol><symbol id="i-type" viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></symbol><symbol id="i-wrap" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><path d="M3 12h15a3 3 0 1 1 0 6h-4"/><polyline points="16 16 14 18 16 20"/><line x1="3" y1="18" x2="10" y2="18"/></symbol><symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol><symbol id="i-dupl" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></symbol></svg>
<header>
  <div class="logo"><button id="mk-face" class="mkf" data-m="idle" aria-label="Miko-chan (colek aku!)" title="Colek Miko"><svg viewBox="0 0 40 40" aria-hidden="true"><g class="ears"><path class="ear" d="M6.5 18 L8.5 4.5 L19 11Z"/><path class="ear" d="M33.5 18 L31.5 4.5 L21 11Z"/><path class="ein" d="M9.6 13.5 L10.4 8.4 L15.2 11Z"/><path class="ein" d="M30.4 13.5 L29.6 8.4 L24.8 11Z"/></g><ellipse class="hd" cx="20" cy="24" rx="15.5" ry="12.5"/><ellipse class="bl" cx="9.8" cy="28" rx="3" ry="1.8"/><ellipse class="bl" cx="30.2" cy="28" rx="3" ry="1.8"/><g class="eyes"><ellipse class="ey" cx="14" cy="23" rx="2.1" ry="2.7"/><ellipse class="ey" cx="26" cy="23" rx="2.1" ry="2.7"/><path class="eh" d="M10.5 24 Q14 19.5 17.5 24"/><path class="eh" d="M22.5 24 Q26 19.5 29.5 24"/><path class="ec" d="M10.8 23 Q14 25.4 17.2 23"/><path class="ec" d="M22.8 23 Q26 25.4 29.2 23"/><path class="br" d="M10.5 20.2 L16.8 18.4"/><path class="br" d="M29.5 20.2 L23.2 18.4"/></g><path class="mo mo-idle" d="M17 28.2 Q18.5 30.4 20 28.2 Q21.5 30.4 23 28.2"/><path class="mo mo-happy" d="M16 27 Q20 34 24 27Z"/><path class="mo mo-worry" d="M17 31 Q20 27.8 23 31"/><path class="mo mo-sleepy" d="M18.5 29 Q20 30.2 21.5 29"/><path class="mo mo-shy" d="M18 29.4 Q19 28.4 20 29.4 Q21 28.4 22 29.4"/><ellipse class="mo mo-think" cx="20" cy="29.4" rx="1.4" ry="1.7"/><ellipse class="mo mo-talk" cx="20" cy="29.2" rx="2.6" ry="2.4"/><path class="sw" d="M34 12 Q36.8 16.4 34 18.4 Q31.2 16.4 34 12Z"/><text class="zz" x="29" y="12">z</text></svg></button><div class="lt"><span>NekoCode</span><small id="pn-t" class="mono">Proyek</small></div></div>
  <div class="hb">
    <button class="btn" id="b-pal" title="Perintah &amp; cari file (Ctrl+K)" aria-label="Perintah" style="padding:0 10px"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l4 4-4 4M12 17h7"/></svg></button>
    <button class="btn run" id="b-run"><svg class="i"><use href="#i-zap"/></svg>RUN</button>
    <button class="btn" id="b-menu" title="Menu" style="padding:0 10px"><svg class="i"><use href="#i-menu"/></svg></button>
  </div>
</header>
<div id="menu" class="menu">
  <button id="b-projs"><svg class="i"><use href="#i-folder"/></svg>Proyek saya</button>
  <button id="b-newp"><svg class="i"><use href="#i-plus"/></svg>Proyek baru</button>
  <hr>
  <button id="b-open"><svg class="i"><use href="#i-file"/></svg>Buka file (HTML, CSS, JS)</button>
  <button id="b-save"><svg class="i"><use href="#i-save"/></svg>Simpan sebagai HTML</button>
  <button id="b-zip"><svg class="i"><use href="#i-archive"/></svg>Ekspor semua file (ZIP)</button>
  <button id="b-exp"><svg class="i"><use href="#i-share"/></svg>Bagikan proyek ini (JSON)</button>
  <button id="b-snd"><svg class="i"><use id="snd-u" href="#i-vol"/></svg><span id="snd-t">Suara: Nyala</span></button>
  <button id="b-theme"><svg class="i"><use href="#i-palette"/></svg><span id="thm-t">Tema: Sakura</span></button>
  <button id="b-fs"><svg class="i"><use href="#i-type"/></svg><span id="fs-t">Ukuran huruf: 14</span></button>
  <button id="b-wrap"><svg class="i"><use href="#i-wrap"/></svg><span id="wr-t">Lipat baris: Nyala</span></button>
  <button id="b-hist"><svg class="i"><use href="#i-clock"/></svg>Riwayat versi</button>
  <hr>
  <button id="b-bk"><svg class="i"><use href="#i-down"/></svg>Cadangkan semua proyek</button>
  <button id="b-rs"><svg class="i"><use href="#i-up"/></svg>Pulihkan dari cadangan</button>
  <small id="bkinfo"></small>
</div>
<input type="file" id="fin" accept=".html,.htm,.css,.js,.mjs,.jsx,.ts,.tsx,.json" multiple class="hide">
<input type="file" id="rin" accept=".json,application/json" class="hide">
<section class="miko" aria-live="polite"><i>Miko-chan</i><em id="miko"></em></section>

<div id="main">
  <section class="pane" id="pane-editor">
    <div class="bar">
      <div class="tabs" id="tabs"></div>
      <div style="display:flex">
        <button class="ib" id="b-copy" title="Salin file ini"><svg class="i"><use href="#i-copy"/></svg></button>
        <button class="ib" id="b-fmt" title="Rapikan kode file ini"><svg class="i"><use href="#i-spark"/></svg></button>
        <button class="ib" id="b-clr" title="Kosongkan file ini"><svg class="i"><use href="#i-trash"/></svg></button>
      </div>
    </div>
    <div id="cm"></div>
    <div id="sym"></div>
  </section>

  <section class="pane" id="pane-right">
    <div id="prev">
      <div class="sb mono">
        <span style="font-weight:700;display:flex;align-items:center;gap:6px"><span style="color:var(--pk);display:flex"><svg class="i"><use href="#i-play"/></svg></span>Live Preview <small id="info" style="color:var(--mu);font-weight:400"></small></span>
        <span style="display:flex;gap:8px;align-items:center">
          <span class="seg dsk" id="seg"><button data-m="r" class="on">100%</button><button data-m="m">HP</button><button data-m="t">Tablet</button></span>
          <button id="b-ref" title="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>
          <button id="b-stop" title="Hentikan preview"><svg class="i"><use href="#i-stop"/></svg></button>
          <button id="b-full" style="color:var(--pk);font-weight:700"><svg class="i"><use href="#i-expand"/></svg><span class="dsk">Layar Penuh</span></button>
        </span>
      </div>
      <div id="wrap"><div id="dv"><iframe id="ifr"></iframe></div></div>
    </div>
    <div id="cons">
      <div class="sb mono"><div style="display:flex;gap:2px"><button class="ct on" id="ct-c"><svg class="i"><use href="#i-term"/></svg>Console</button><button class="ct" id="ct-n">Network <span id="net-n" class="hide"></span></button></div><button id="b-cc">Clear</button></div>
      <div id="logs" class="mono"><div style="color:#6b7280;font-style:italic">Console siap desu~</div></div>
      <div id="net" class="mono hide"><div class="ne">Belum ada request. Panggil <code>fetch('/api/…')</code> di kodemu, atau pakai mock.json sebagai backend tiruan.</div></div>
    </div>
  </section>
</div>

<div class="modal" id="palm" role="dialog" aria-label="Palet perintah"><div class="sheet" id="pals"><input type="text" id="palq" placeholder="Cari perintah atau file…  (:12 = ke baris 12)" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"><div id="pall" role="listbox"></div></div></div>
<nav id="mnav">
  <button class="mt on" data-t="code"><svg class="i"><use href="#i-code"/></svg>Kode</button>
  <button class="mt" data-t="preview"><svg class="i"><use href="#i-eye"/></svg>Hasil</button>
  <button class="mt" data-t="console"><svg class="i"><use href="#i-term"/></svg>Console<b id="badge" class="hide">0</b></button>
</nav>
</div>

<div class="modal" id="m-proj"><div class="sheet">
  <div class="sh"><span style="display:flex;align-items:center;gap:8px"><svg class="i"><use href="#i-folder"/></svg>Proyek</span><button class="ib" id="m-close" style="height:28px"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="sbd">
    <label style="font-size:12px;display:flex;gap:8px;align-items:center;color:#d1d5db"><input type="checkbox" id="ls"> Izinkan localStorage di preview proyek ini <small style="color:var(--mu)">(preview jadi satu origin dengan app)</small></label>
    <div id="plist" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>
</div></div>

<div class="modal" id="m-new"><div class="sheet">
  <div class="sh"><span style="display:flex;align-items:center;gap:8px"><svg class="i"><use href="#i-plus"/></svg>Proyek baru</span><button class="ib" id="n-close" style="height:28px"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="sbd">
    <input type="text" id="nname" placeholder="Nama proyek (opsional)" maxlength="40">
    <select id="tpl"></select>
    <button class="btn run" id="b-new" style="justify-content:center"><svg class="i"><use href="#i-plus"/></svg>Buat proyek</button>
  </div>
</div></div>

<div class="modal" id="m-hist"><div class="sheet">
  <div class="sh"><span style="display:flex;align-items:center;gap:8px"><svg class="i"><use href="#i-clock"/></svg>Riwayat versi</span><button class="ib" id="h-close" style="height:28px"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="sbd"><small style="color:var(--mu)">Disimpan otomatis tiap kali RUN dan kode berubah (10 terakhir).</small><div id="hlist" style="display:flex;flex-direction:column;gap:6px"></div></div>
</div></div>

<div class="modal fs" id="m-full">
  <div style="height:48px;background:var(--pn);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0">
    <b class="mono" style="font-size:13px;display:flex;align-items:center;gap:8px"><svg class="i"><use href="#i-expand"/></svg>FULLSCREEN</b><button class="btn" id="b-fclose"><svg class="i"><use href="#i-x"/></svg>Tutup (Esc)</button>
  </div>
  <div style="flex:1;background:#fff"><iframe id="ifr2"></iframe></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
